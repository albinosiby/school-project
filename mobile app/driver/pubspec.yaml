name: driver_app
description: School transport driver and attendant application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: 9.1.1
  equatable: 2.0.8
  flutter_screenutil: 5.9.3
  go_router: 14.8.1
  get_it: 8.3.0
  google_fonts: 6.3.3
  flutter_svg: 2.2.3
  shared_preferences: 2.3.4
