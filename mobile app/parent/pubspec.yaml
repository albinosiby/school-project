name: parent_app
description: "Greenfield International School - Parent app (UI-first, mock data)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.8.1

  # Responsive sizing (every page uses .w .h .r .sp)
  flutter_screenutil: ^5.9.3

  # State management
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Storage
  shared_preferences: ^2.3.4

  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
